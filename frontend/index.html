<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chadrey">
<title>Chadrey Wholesale</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
  <h1 class="large-title">Chadrey</h1>

  <form class="search" action="products.html" role="search">
    <span id="searchIcon"></span>
    <input type="search" name="q" placeholder="Search products" aria-label="Search products" enterkeyhint="search">
  </form>

  <div class="spacer"></div>
  <div class="banner">
    <span class="cell-icon" style="background:var(--blue)" id="bannerIcon"></span>
    <div><b>Direct from Thai dealers</b><p>Prices follow the exchange rate, so they move. The price you see is today's — request a quote to lock yours in.</p></div>
  </div>

  <div id="home"></div>
</main>

<script src="config.js"></script>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
  UI.mount({ tab: "home", title: "Chadrey" });
  document.getElementById("searchIcon").innerHTML = UI.icon("search", 18);
  document.getElementById("bannerIcon").innerHTML = UI.icon("tag", 18);

  async function load() {
    const root = document.getElementById("home");
    root.innerHTML = '<div class="products" style="margin-top:28px">' + UI.skeletonGrid(4) + "</div>";
    try {
      const [items, s] = await Promise.all([Store.products(), Store.settings()]);
      if (!items.length) {
        root.innerHTML = '<div class="empty">' + UI.icon("box", 56) + "<h3>No products yet</h3><p>New arrivals are on the way. Check back soon.</p></div>";
        return;
      }
      const cats = Store.categories(items).slice(0, 8);
      const newest = items.slice().sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || "")).slice(0, 8);
      root.innerHTML =
        '<div class="section-title"><h2>Categories</h2></div>' +
        '<div class="cats">' + cats.map((c) => {
          const cs = UI.catStyle(c.name);
          return '<a class="cat" href="products.html?cat=' + encodeURIComponent(c.name) + '"><span class="tile" style="' + UI.tileBg(cs.color) + '">' + UI.icon(cs.icon, 28) + "</span><span>" + UI.esc(c.name) + "<small>" + c.count + "</small></span></a>";
        }).join("") + "</div>" +
        '<div class="section-title"><h2>New arrivals</h2><a href="products.html">See all</a></div>' +
        '<div class="hscroll">' + newest.map((p) => UI.productCard(p, s)).join("") + "</div>" +
        '<div class="section-title"><h2>Browse</h2></div>' +
        '<div class="products">' + items.slice(0, 8).map((p) => UI.productCard(p, s)).join("") + "</div>" +
        (items.length > 8 ? '<div style="margin-top:20px"><a class="btn btn-block" href="products.html">See all ' + items.length + " products</a></div>" : "");
    } catch (e) {
      root.innerHTML = '<div class="empty">' + UI.icon("info", 56) + "<h3>Couldn't load products</h3><p>" + UI.esc(e.message) + '</p><button class="btn" id="retry">Try again</button></div>';
      document.getElementById("retry").onclick = load;
    }
  }
  load();
</script>
</body>
</html>
