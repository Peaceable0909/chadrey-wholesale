<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Invoice — Chadrey Wholesale</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page narrow" id="root"><div class="skel" style="height:360px;margin-top:8px"></div></main>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
  UI.mount({ tab: "quotes", title: "Invoice", back: true, backHref: "my-quotes.html", tabs: false });
  const $root = document.getElementById("root");
  const line = (a, b) => b ? '<div class="doc-line"><span>' + a + "</span><span>" + UI.esc(b) + "</span></div>" : "";

  async function render() {
    const [q, s] = await Promise.all([Store.quote(UI.qs("ref")), Store.settings()]);
    if (!q || !q.invoice) {
      $root.innerHTML = '<div class="empty">' + UI.icon("doc", 56) + "<h3>No invoice yet</h3><p>We'll issue it once your quotation is accepted and the final cost is confirmed.</p>" +
        '<a class="btn" href="' + (q ? "quotation.html?ref=" + encodeURIComponent(q.ref) : "my-quotes.html") + '">Back</a></div>';
      return;
    }
    const i = q.invoice, c = i.currency, m = (n) => Store.money(n, c);
    const sub = i.unitPrice * i.qty, total = Store.invoiceTotal(i), paid = q.status === "paid";
    const wa = await UI.whatsappHref("Hi, about invoice " + q.ref);
    $root.innerHTML = '<h1 class="large-title">Invoice</h1><div class="doc">' +
      '<div class="doc-top"><div class="kicker">Total due</div><div class="big">' + UI.esc(m(total)) + '</div><div class="caption">' + UI.esc(q.ref) + " · " + Store.fmtDate(i.issuedAt) + "</div>" +
        '<div style="margin-top:8px">' + (paid ? UI.statusBadge("paid") : UI.statusBadge("invoiced")) + "</div></div>" +
      '<div class="doc-lines">' + line("Product", q.product) + line("Quantity", i.qty + " pcs") + line("Unit price", m(i.unitPrice) + " / pc") +
        line("Subtotal", m(sub)) + line("Shipping", i.shipping ? m(i.shipping) : "") + line("Tax / duties", i.tax ? m(i.tax) : "") + line("Other charges", i.other ? m(i.other) : "") +
        '<div class="doc-line total"><span>Total</span><span>' + UI.esc(m(total)) + "</span></div>" +
        line("Ships", i.shipDate ? Store.fmtDate(i.shipDate) : "") + line("Delivery", i.deliveryWindow) + "</div>" +
      (!paid && i.paymentInfo ? '<div class="doc-note"><b style="color:var(--label)">How to pay</b>\n' + UI.esc(i.paymentInfo) + "</div>" : "") +
      (paid ? '<div class="doc-note">Payment received' + (q.paidAt ? " on " + Store.fmtDate(q.paidAt) : "") + ". Thank you!</div>" : "") +
      '<div class="doc-actions">' + (wa ? '<a class="btn btn-block" target="_blank" rel="noopener" href="' + UI.esc(wa) + '">Questions about this invoice</a>' : "") +
        '<button class="btn btn-block" onclick="window.print()">Save as PDF / Print</button></div></div>';
  }
  render().catch((e) => { $root.innerHTML = '<div class="empty">' + UI.icon("info", 56) + "<h3>Couldn't load</h3><p>" + UI.esc(e.message) + "</p></div>"; });
</script>
</body>
</html>
