<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Quotation — Chadrey Wholesale</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page narrow" id="root"><div class="skel" style="height:320px;margin-top:8px"></div></main>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
  UI.mount({ tab: "quotes", title: "Quotation", back: true, backHref: "my-quotes.html", tabs: false });
  const $root = document.getElementById("root");
  const ref = UI.qs("ref");

  const line = (a, b) => b ? '<div class="doc-line"><span>' + a + "</span><span>" + UI.esc(b) + "</span></div>" : "";

  async function render() {
    const [q, s] = await Promise.all([Store.quote(ref), Store.settings()]);
    if (!q) { $root.innerHTML = '<div class="empty">' + UI.icon("doc", 56) + "<h3>Quote not found</h3><p>Check the reference and try again.</p><a class=\"btn\" href=\"my-quotes.html\">Back to quotes</a></div>"; return; }
    Store.rememberRef(q.ref);
    const wa = await UI.whatsappHref("Hi, about my quote " + q.ref);
    const chosen = [q.color, (q.sizes || []).join(", ")].filter(Boolean).join(" · ");
    const base = line("Product", q.product) + line("Options", chosen) + line("Packaging", q.packaging) + line("Customisation", q.customization);
    const chat = wa ? '<a class="btn btn-block" target="_blank" rel="noopener" href="' + UI.esc(wa) + '">Ask a question</a>' : "";

    if (!q.quotation) {
      $root.innerHTML = '<h1 class="large-title">Quote request</h1><div class="doc">' +
        '<div class="doc-top"><div class="kicker">' + UI.esc(q.ref) + '</div><div class="big" style="font-size:28px">Being priced</div><div>' + UI.statusBadge("pending") + "</div></div>" +
        '<div class="doc-lines">' + base + line("Quantity", q.qty + " pcs") + line("Price you saw", q.estUnitPrice ? Store.money(q.estUnitPrice, q.estCurrency) + " / pc" : "") + line("Sent", Store.fmtDate(q.createdAt)) + "</div>" +
        '<div class="doc-note">We\'re confirming today\'s price and stock with the dealer. You\'ll see your quotation here, usually within 1–2 business days.</div>' +
        (chat ? '<div class="doc-actions">' + chat + "</div>" : "") + "</div>";
      return;
    }
    const qt = q.quotation, total = qt.unitPrice * qt.qty;
    const accepted = !!q.acceptedAt, hasInvoice = !!q.invoice;
    $root.innerHTML = '<h1 class="large-title">Quotation</h1><div class="doc">' +
      '<div class="doc-top"><div class="kicker">Estimated product cost</div><div class="big">' + UI.esc(Store.money(total, qt.currency)) + '</div><div class="caption">' + UI.esc(q.ref) + " · " + Store.fmtDate(qt.issuedAt) + "</div></div>" +
      '<div class="doc-lines">' + base + line("Quantity", qt.qty + " pcs") + line("Unit price", Store.money(qt.unitPrice, qt.currency) + " / pc") +
        '<div class="doc-line total"><span>Product total</span><span>' + UI.esc(Store.money(total, qt.currency)) + "</span></div></div>" +
      '<div class="doc-note">This is an estimate. The final price can change with the exchange rate, dealer pricing, shipping and duties — all confirmed on your invoice. Shipping and duties are not included.' + (qt.notes ? "\n\n" + UI.esc(qt.notes) : "") + "</div>" +
      '<div class="doc-actions">' +
        (hasInvoice ? '<a class="btn btn-primary btn-block" href="invoice.html?ref=' + encodeURIComponent(q.ref) + '">View invoice</a>'
          : accepted ? '<div class="center muted" style="padding:6px 0">' + UI.statusBadge("paid").replace("Paid", "Accepted") + '<p class="footnote">Thanks — we\'re preparing your invoice.</p></div>'
          : '<button class="btn btn-primary btn-block" id="accept">Accept quotation</button>') +
        chat + "</div></div>";
    const acc = document.getElementById("accept");
    if (acc) acc.onclick = async () => {
      acc.disabled = true; acc.textContent = "Accepting…";
      try { await Store.acceptQuotation(q.ref); UI.toast("Accepted — invoice coming soon"); render(); }
      catch (e) { UI.toast(e.message); acc.disabled = false; acc.textContent = "Accept quotation"; }
    };
  }
  render().catch((e) => { $root.innerHTML = '<div class="empty">' + UI.icon("info", 56) + "<h3>Couldn't load</h3><p>" + UI.esc(e.message) + "</p></div>"; });
</script>
</body>
</html>
