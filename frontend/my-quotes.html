<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Quotes — Chadrey Wholesale</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page narrow">
  <h1 class="large-title">Quotes</h1>
  <div class="seg" id="filter" role="group" aria-label="Filter">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="pending" aria-pressed="false">Requested</button>
    <button data-f="quoted" aria-pressed="false">Quoted</button>
    <button data-f="invoiced" aria-pressed="false">Invoiced</button>
    <button data-f="paid" aria-pressed="false">Paid</button>
  </div>
  <div class="spacer"></div>
  <div id="list"></div>

  <div class="list-header">Have a reference?</div>
  <form class="list" id="find">
    <div class="cell field-row" style="gap:12px">
      <div class="field-half"><label for="refIn">Reference number</label><input id="refIn" placeholder="WR-2026-12345" autocapitalize="characters" autocomplete="off"></div>
      <button class="btn btn-sm btn-primary" type="submit" style="align-self:flex-end">Find</button>
    </div>
  </form>
  <p class="footnote">Quotes you request are saved on this device. Use a reference to open one from another phone.</p>
</main>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
  UI.mount({ tab: "quotes", title: "Quotes" });
  let quotes = [], filter = "all", products = [];

  function render() {
    const items = quotes.filter((q) => filter === "all" || q.status === filter);
    const $l = document.getElementById("list");
    if (!items.length) {
      $l.innerHTML = '<div class="empty">' + UI.icon("doc", 56) + "<h3>" + (quotes.length ? "Nothing here" : "No quotes yet") + "</h3><p>" +
        (quotes.length ? "No quotes in this group." : "Pick a product and request a quote. It will show up here.") + "</p>" +
        (quotes.length ? "" : '<a class="btn btn-primary" href="products.html">Browse products</a>') + "</div>";
      return;
    }
    $l.innerHTML = '<div class="list">' + items.map((q) => {
      const prod = products.find((x) => x.id === q.productId);
      const dest = (q.status === "invoiced" || q.status === "paid") ? "invoice.html" : "quotation.html";
      let amt = "";
      if (q.invoice) amt = Store.money(Store.invoiceTotal(q.invoice), q.invoice.currency);
      else if (q.quotation) amt = Store.money(q.quotation.unitPrice * q.quotation.qty, q.quotation.currency);
      return '<a class="cell" href="' + dest + "?ref=" + encodeURIComponent(q.ref) + '">' +
        '<div class="thumb">' + UI.visual(prod || { name: q.product, category: "", images: [] }) + "</div>" +
        '<div class="grow"><span class="title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + UI.esc(q.product) + "</span>" +
        '<span class="sub">' + UI.esc(q.ref) + " · " + q.qty + " pcs · " + Store.fmtDate(q.createdAt) + "</span>" +
        '<span style="display:block;margin-top:5px">' + UI.statusBadge(q.status) + "</span></div>" +
        (amt ? '<b style="font-size:16px">' + UI.esc(amt) + "</b>" : "") + '<span class="chev">' + UI.icon("chev", 18) + "</span></a>";
    }).join("") + "</div>";
  }

  document.getElementById("filter").addEventListener("click", (e) => {
    const b = e.target.closest("[data-f]"); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll("#filter button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    render();
  });

  document.getElementById("find").addEventListener("submit", async (e) => {
    e.preventDefault();
    const ref = document.getElementById("refIn").value.trim().toUpperCase();
    if (!ref) return;
    try {
      const q = await Store.quote(ref);
      if (!q) { UI.toast("No quote with that reference"); return; }
      Store.rememberRef(q.ref); document.getElementById("refIn").value = "";
      quotes = await Store.myQuotes(); render(); UI.toast("Added " + q.ref);
    } catch (x) { UI.toast(x.message); }
  });

  (async function () {
    document.getElementById("list").innerHTML = '<div class="skel" style="height:240px"></div>';
    try { [quotes, products] = await Promise.all([Store.myQuotes(), Store.products().catch(() => [])]); render(); }
    catch (e) { document.getElementById("list").innerHTML = '<div class="empty">' + UI.icon("info", 56) + "<h3>Couldn't load</h3><p>" + UI.esc(e.message) + "</p></div>"; }
  })();
</script>
</body>
</html>
