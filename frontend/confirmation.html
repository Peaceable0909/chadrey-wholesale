<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Request sent — Chadrey Wholesale</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page narrow center">
  <div class="hero-check" id="check"></div>
  <h1 class="large-title" style="margin-bottom:6px">Request sent</h1>
  <p class="muted" style="margin-bottom:6px">Your reference</p>
  <p style="font-size:24px;font-weight:700;letter-spacing:.02em" id="ref"></p>

  <div class="list-header" style="margin-top:32px;text-align:left">What happens next</div>
  <div class="list" style="text-align:left">
    <div class="step"><span class="n">1</span><div><h3>We check today's price</h3><p>We confirm cost and stock with the dealer, usually within 1–2 business days.</p></div></div>
    <div class="step"><span class="n">2</span><div><h3>You get a quotation</h3><p>It shows up under Quotes — accept it to move on to your invoice.</p></div></div>
  </div>

  <div class="stack" style="margin-top:28px">
    <a class="btn btn-primary btn-block" href="my-quotes.html">View my quotes</a>
    <a class="btn btn-block" href="products.html">Keep browsing</a>
  </div>
</main>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
  UI.mount({ tab: "quotes", title: "Request sent" });
  document.getElementById("check").innerHTML = UI.icon("check", 44).replace('stroke-width="1.8"', 'stroke-width="2.6"');
  document.getElementById("ref").textContent = UI.qs("ref") || "";
</script>
</body>
</html>
