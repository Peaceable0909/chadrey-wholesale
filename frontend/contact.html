<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Contact — Chadrey Wholesale</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page narrow">
  <h1 class="large-title">Contact us</h1>
  <p class="subtitle">Questions about a product, a quote or an order? Message us directly.</p>
  <div id="opts"></div>
</main>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
  UI.mount({ tab: "more", title: "Contact", back: true, backHref: "more.html" });
  (async function () {
    const s = await Store.settings();
    const wa = await UI.whatsappHref("Hi Chadrey Wholesale, ");
    const rows = [];
    if (wa) rows.push('<a class="cell" target="_blank" rel="noopener" href="' + UI.esc(wa) + '"><span class="cell-icon" style="background:var(--green)">' + UI.icon("chat", 18) + '</span><span class="grow"><span class="title">WhatsApp</span><span class="sub">' + UI.esc(s.whatsapp) + '</span></span><span class="chev">' + UI.icon("chev", 18) + "</span></a>");
    if (s.email) rows.push('<a class="cell" href="mailto:' + UI.esc(s.email) + '"><span class="cell-icon" style="background:var(--blue)">' + UI.icon("mail", 18) + '</span><span class="grow"><span class="title">Email</span><span class="sub">' + UI.esc(s.email) + '</span></span><span class="chev">' + UI.icon("chev", 18) + "</span></a>");
    document.getElementById("opts").innerHTML = rows.length ? '<div class="list">' + rows.join("") + "</div>"
      : '<div class="empty">' + UI.icon("chat", 56) + "<h3>Contact details coming soon</h3><p>Meanwhile, request a quote and we'll reply to you.</p><a class=\"btn btn-primary\" href=\"products.html\">Browse products</a></div>";
  })();
</script>
</body>
</html>
