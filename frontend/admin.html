<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Admin — Chadrey Wholesale</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page" id="root"></main>
<dialog class="sheet" id="sheet" aria-modal="true"></dialog>

<script src="config.js"></script>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  const $root = document.getElementById("root");
  const $sheet = document.getElementById("sheet");
  const esc = UI.esc;
  const THB = (n) => Store.money(n, "THB");
  let tab = "products";
  let products = [], quotes = [], settings = {}, qFilter = "all", pQuery = "";

  const bar = UI.mount({ tab: null, title: "Admin", back: true, backHref: "more.html", tabs: false,
    right: '<button class="nav-btn" id="signout" hidden>Sign out</button><button class="nav-btn strong" id="addBtn" aria-label="Add product">' + UI.icon("plus", 24) + "</button>" });
  document.getElementById("signout").onclick = () => { Store.admin.logout(); location.reload(); };
  document.getElementById("addBtn").onclick = () => openProduct(null);

  /* ---------- sheet helpers ---------- */
  function openSheet(title, bodyHtml, opts) {
    const o = opts || {};
    $sheet.innerHTML = '<div class="sheet-bar"><div><button class="nav-btn" data-close>' + (o.cancel || "Close") + "</button></div><h2>" + esc(title) + '</h2><div class="r">' +
      (o.save ? '<button class="nav-btn strong" id="sheetSave">' + o.save + "</button>" : "") + '</div></div><div class="sheet-body">' + bodyHtml + "</div>";
    $sheet.querySelectorAll("[data-close]").forEach((b) => (b.onclick = () => $sheet.close()));
    if (!$sheet.open) $sheet.showModal();
    $sheet.querySelector(".sheet-body").scrollTop = 0;
    return $sheet;
  }
  $sheet.addEventListener("click", (e) => { if (e.target === $sheet) $sheet.close(); });
  const field = (id, label, value, attrs) => '<div class="cell field"><label for="' + id + '">' + label + '</label><input id="' + id + '" value="' + esc(value == null ? "" : value) + '" ' + (attrs || "") + "></div>";
  const half = (id, label, value, attrs) => '<div class="field-half"><label for="' + id + '">' + label + '</label><input id="' + id + '" value="' + esc(value == null ? "" : value) + '" ' + (attrs || "") + "></div>";
  const val = (id) => document.getElementById(id).value.trim();

  async function run(btn, label, fn) {
    const old = btn.textContent; btn.disabled = true; btn.textContent = label;
    try { await fn(); } catch (e) { UI.toast(e.message || "Something went wrong"); }
    finally { btn.disabled = false; btn.textContent = old; }
  }

  /* ---------- login gate (live mode) ---------- */
  function gate() {
    document.getElementById("addBtn").hidden = true;
    $root.innerHTML = '<div class="empty" style="padding-top:72px">' + UI.icon("lock", 56) + "<h3>Owner access</h3><p>Enter your access code to manage products and quotes.</p>" +
      '<form id="gate" class="stack" style="max-width:320px;margin:0 auto"><div class="list"><div class="cell field"><label for="code">Access code</label><input id="code" type="password" autocomplete="current-password" required></div></div>' +
      '<button class="btn btn-primary btn-block" type="submit">Continue</button></form></div>';
    document.getElementById("gate").onsubmit = (e) => {
      e.preventDefault();
      run(e.target.querySelector("button"), "Checking…", async () => { await Store.admin.login(document.getElementById("code").value); boot(); });
    };
  }

  /* ---------- shell ---------- */
  function shell() {
    document.getElementById("signout").hidden = !Store.remote;
    document.getElementById("addBtn").hidden = tab !== "products";
    $root.innerHTML = '<h1 class="large-title">Admin</h1>' +
      '<div class="seg" id="tabs" role="group" aria-label="Section">' +
      ["products:Products", "quotes:Quotes", "settings:Settings"].map((t) => { const [k, l] = t.split(":"); return '<button data-t="' + k + '" aria-pressed="' + (tab === k) + '">' + l + "</button>"; }).join("") +
      '</div><div class="spacer"></div><div id="pane"></div>';
    document.getElementById("tabs").onclick = (e) => { const b = e.target.closest("[data-t]"); if (!b) return; tab = b.dataset.t; shell(); renderPane(); };
  }
  function renderPane() { ({ products: renderProducts, quotes: renderQuotes, settings: renderSettings })[tab](); }

  /* ================= PRODUCTS ================= */
  function renderProducts() {
    const pane = document.getElementById("pane");
    const q = pQuery.toLowerCase();
    const rows = products.filter((p) => !q || (p.name + " " + p.category + " " + p.dealer).toLowerCase().includes(q));
    pane.innerHTML =
      '<div class="row"><div class="search grow">' + UI.icon("search", 18) + '<input id="pq" type="search" placeholder="Search your products" value="' + esc(pQuery) + '" aria-label="Search your products"></div>' +
      '<button class="btn btn-primary btn-sm" id="newP">' + UI.icon("plus", 16) + " Add</button></div>" +
      '<p class="caption" style="margin:12px 4px 8px">' + products.length + (products.length === 1 ? " product" : " products") + "</p>" +
      (rows.length ? '<div class="list">' + rows.map((p) =>
        '<button class="cell" data-id="' + esc(p.id) + '"><div class="thumb">' + UI.visual(p) + '</div><div class="grow"><span class="title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(p.name) + "</span>" +
        '<span class="sub">' + THB(p.tiers[0].price) + " · MOQ " + p.moq + " · " + esc(p.category) + (p.dealer ? " · " + esc(p.dealer) : "") + "</span>" +
        (!p.active || p.sample ? '<span style="display:block;margin-top:4px">' + (!p.active ? '<span class="badge">Hidden</span> ' : "") + (p.sample ? '<span class="badge orange">Sample</span>' : "") + "</span>" : "") +
        '</div><span class="chev">' + UI.icon("chev", 18) + "</span></button>").join("") + "</div>"
        : '<div class="empty">' + UI.icon("box", 56) + "<h3>" + (products.length ? "No matches" : "No products yet") + "</h3><p>" + (products.length ? "Try a different word." : "Add your first dealer product with photos and a price.") + "</p></div>");
    document.getElementById("newP").onclick = () => openProduct(null);
    const pq = document.getElementById("pq");
    pq.oninput = () => { pQuery = pq.value; const pos = pq.selectionStart; renderProducts(); const n = document.getElementById("pq"); n.focus(); n.setSelectionRange(pos, pos); };
    pane.querySelectorAll("[data-id]").forEach((b) => (b.onclick = () => openProduct(products.find((p) => p.id === b.dataset.id))));
  }

  function tierRow(t) {
    return '<div class="tier-edit"><div class="f"><label>From quantity</label><input data-min type="number" inputmode="numeric" min="1" value="' + esc(t ? t.min : "") + '" placeholder="e.g. 200"></div>' +
      '<div class="f"><label>Price per unit (฿)</label><input data-price type="number" inputmode="decimal" step="any" min="0" value="' + esc(t ? t.price : "") + '" placeholder="e.g. 115"></div>' +
      '<button type="button" class="x" aria-label="Remove price break" data-x>' + UI.icon("x", 18) + "</button></div>";
  }

  function openProduct(p) {
    const isNew = !p;
    const cur = p ? JSON.parse(JSON.stringify(p)) : { images: [], tiers: [{ min: 1, price: "" }], moq: 1, unit: "pc", active: true, colors: [], sizes: [], packaging: [], customization: [] };
    const cats = [...new Set(["Apparel", "Bags", "Footwear", "Home", "Beauty", "Food", "Electronics"].concat(products.map((x) => x.category)))];
    const html =
      '<div class="list-header">Photos</div><div class="list"><div class="photos" id="photos"></div></div>' +
      '<p class="footnote">The first photo is the cover. Photos are shrunk automatically so pages stay fast.</p>' +
      '<div class="list-header">Details</div><div class="list">' +
        field("f_name", "Product name", cur.name, 'placeholder="e.g. Cotton Oversized T-Shirt" required') +
        '<div class="cell field"><label for="f_cat">Category</label><input id="f_cat" list="catlist" value="' + esc(cur.category || "") + '" placeholder="Pick or type a new one"><datalist id="catlist">' + cats.map((c) => '<option value="' + esc(c) + '">').join("") + "</datalist></div>" +
        '<div class="cell field"><label for="f_desc">Description</label><textarea id="f_desc" placeholder="Material, sizes, what makes it good">' + esc(cur.desc || "") + "</textarea></div></div>" +
      '<div class="list-header">Price (Thai baht)</div><div class="list">' +
        '<div class="cell field-row">' + half("f_price", "Price per unit (฿)", cur.tiers[0].price, 'type="number" inputmode="decimal" step="any" min="0" placeholder="129"') + half("f_moq", "Minimum order", cur.moq, 'type="number" inputmode="numeric" min="1"') + "</div>" +
        '<div class="cell field-row">' + half("f_unit", "Sold per", cur.unit, 'placeholder="pc, pack, kg…"') + half("f_lead", "Lead time", cur.lead, 'placeholder="7–10 days"') + "</div></div>" +
      '<div class="list-header">Bulk price breaks</div><div class="list"><div id="tiers">' + cur.tiers.slice(1).map(tierRow).join("") + '</div><button type="button" class="cell" id="addTier" style="color:var(--blue)">' + UI.icon("plus", 20) + ' <span class="grow">Add a bulk price</span></button></div>' +
      '<p class="footnote">Lower prices for bigger orders, like 1688. Customers see the right price as they raise the quantity.</p>' +
      '<div class="list-header">Shipping</div><div class="list">' + field("f_origin", "Ships from (city)", cur.origin, 'placeholder="Bangkok"') + "</div>" +
      '<div class="list-header">Options (separate with commas)</div><div class="list">' +
        field("f_colors", "Colours", (cur.colors || []).join(", "), 'placeholder="Black, White, Grey"') + field("f_sizes", "Sizes", (cur.sizes || []).join(", "), 'placeholder="S, M, L, XL"') +
        field("f_pack", "Packaging", (cur.packaging || []).join(", "), 'placeholder="Individual poly bag, Bulk carton"') + field("f_custom", "Customisation", (cur.customization || []).join(", "), 'placeholder="Plain, Custom print / logo"') + "</div>" +
      '<div class="list-header">Private — customers never see this</div><div class="list">' + field("f_dealer", "Dealer name / contact", cur.dealer, 'placeholder="e.g. Khun Somchai, 08x-xxx-xxxx"') + "</div>" +
      '<div class="list-header">Visibility</div><div class="list"><div class="cell"><span class="grow"><span class="title">Show in shop</span><span class="sub">Turn off to hide without deleting</span></span><label class="switch"><input type="checkbox" id="f_active"' + (cur.active !== false ? " checked" : "") + ' aria-label="Show in shop"><span></span></label></div></div>' +
      (isNew ? "" : '<div class="spacer"></div><button class="btn btn-block btn-danger" id="del">Delete product</button>') +
      (cur.priceUpdated ? '<p class="footnote center">Price last changed ' + Store.fmtDate(cur.priceUpdated) + "</p>" : "");
    openSheet(isNew ? "New product" : "Edit product", html, { save: "Save", cancel: "Cancel" });

    /* photos */
    let images = cur.images.slice();
    const $photos = document.getElementById("photos");
    function drawPhotos() {
      $photos.innerHTML = images.map((u, i) => '<div class="photo"><img src="' + esc(Store.img(u)) + '" alt="Photo ' + (i + 1) + '">' + (i === 0 ? '<span class="cover">Cover</span>' : "") +
        '<button type="button" data-rm="' + i + '" aria-label="Remove photo">' + UI.icon("x", 14) + "</button></div>").join("") +
        (images.length < 8 ? '<label class="photo-add">' + UI.icon("camera", 26) + "<span>Add photos</span><input type=\"file\" id=\"file\" accept=\"image/*\" multiple></label>" : "");
      $photos.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = () => { images.splice(+b.dataset.rm, 1); drawPhotos(); }));
      const f = document.getElementById("file");
      if (f) f.onchange = async () => {
        const files = [...f.files].slice(0, 8 - images.length);
        const label = $photos.querySelector(".photo-add span");
        for (let i = 0; i < files.length; i++) {
          if (label) label.textContent = "Uploading " + (i + 1) + "/" + files.length + "…";
          try { images.push(await Store.uploadImage(await Store.resizeImage(files[i]))); }
          catch (e) { UI.toast(e.message); break; }
        }
        drawPhotos();
      };
    }
    drawPhotos();

    /* bulk tiers */
    const $tiers = document.getElementById("tiers");
    const bindTiers = () => $tiers.querySelectorAll("[data-x]").forEach((b) => (b.onclick = () => b.closest(".tier-edit").remove()));
    bindTiers();
    document.getElementById("addTier").onclick = () => {
      $tiers.insertAdjacentHTML("beforeend", tierRow(null)); bindTiers();
      const last = $tiers.lastElementChild.querySelector("[data-min]"); last.focus();
    };

    /* delete */
    const del = document.getElementById("del");
    if (del) del.onclick = () => {
      if (!confirm("Delete “" + cur.name + "”? This can't be undone.")) return;
      run(del, "Deleting…", async () => { await Store.deleteProduct(cur.id); $sheet.close(); UI.toast("Deleted"); await reloadProducts(); });
    };

    /* save */
    document.getElementById("sheetSave").onclick = (e) => run(e.target, "Saving…", async () => {
      const tiers = [{ min: parseInt(val("f_moq"), 10) || 1, price: parseFloat(val("f_price")) }];
      $tiers.querySelectorAll(".tier-edit").forEach((r) => {
        const min = parseInt(r.querySelector("[data-min]").value, 10), price = parseFloat(r.querySelector("[data-price]").value);
        if (min > 0 && price > 0) tiers.push({ min, price });
      });
      await Store.saveProduct({
        id: isNew ? undefined : cur.id, name: val("f_name"), category: val("f_cat") || "Other", desc: val("f_desc"), images,
        moq: parseInt(val("f_moq"), 10) || 1, unit: val("f_unit") || "pc", tiers, origin: val("f_origin"), lead: val("f_lead"),
        colors: val("f_colors"), sizes: val("f_sizes"), packaging: val("f_pack"), customization: val("f_custom"),
        dealer: val("f_dealer"), active: document.getElementById("f_active").checked,
        icon: cur.icon, createdAt: cur.createdAt,
      });
      $sheet.close(); UI.toast(isNew ? "Product added" : "Saved");
      await reloadProducts();
    });
  }

  async function reloadProducts() { products = await Store.products({ admin: true }); if (tab === "products") renderProducts(); }

  /* ================= QUOTES ================= */
  function renderQuotes() {
    const pane = document.getElementById("pane");
    const items = quotes.filter((q) => qFilter === "all" || q.status === qFilter);
    pane.innerHTML = '<div class="seg" id="qf" role="group" aria-label="Filter">' +
      ["all:All", "pending:New", "quoted:Quoted", "invoiced:Invoiced", "paid:Paid"].map((t) => { const [k, l] = t.split(":"); return '<button data-f="' + k + '" aria-pressed="' + (qFilter === k) + '">' + l + "</button>"; }).join("") + '</div><div class="spacer"></div>' +
      (items.length ? '<div class="list">' + items.map((q) =>
        '<button class="cell" data-ref="' + esc(q.ref) + '"><div class="grow"><span class="title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(q.product) + " × " + q.qty + '</span><span class="sub">' + esc(q.company || "") + " · " + esc(q.ref) + " · " + Store.fmtDate(q.createdAt) + "</span>" +
        '<span style="display:block;margin-top:4px">' + UI.statusBadge(q.status) + (q.acceptedAt && q.status === "quoted" ? ' <span class="badge green">Accepted — send invoice</span>' : "") + '</span></div><span class="chev">' + UI.icon("chev", 18) + "</span></button>").join("") + "</div>"
        : '<div class="empty">' + UI.icon("doc", 56) + "<h3>No quotes</h3><p>Customer requests will appear here.</p></div>");
    document.getElementById("qf").onclick = (e) => { const b = e.target.closest("[data-f]"); if (!b) return; qFilter = b.dataset.f; renderQuotes(); };
    pane.querySelectorAll("[data-ref]").forEach((b) => (b.onclick = () => openQuote(quotes.find((q) => q.ref === b.dataset.ref))));
  }

  const dl = (a, b) => (b ? '<div class="cell"><span class="muted" style="flex:0 0 96px">' + a + '</span><span class="grow" style="text-align:right;word-break:break-word">' + b + "</span></div>" : "");

  function openQuote(q) {
    const prod = products.find((p) => p.id === q.productId);
    const now = prod ? Store.priceFor(prod, q.qty) : "";
    const qt = q.quotation, inv = q.invoice;
    const wa = (q.whatsapp || q.phone || "").replace(/[^\d]/g, "");
    const cur = (qt && qt.currency) || "THB";

    const quotationForm = (pre) =>
      '<div class="list">' + '<div class="cell field-row">' + half("qc", "Currency", pre.currency || "THB", 'maxlength="3" autocapitalize="characters"') + half("qq", "Quantity", pre.qty, 'type="number" inputmode="numeric" min="1"') + "</div>" +
      field("qp", "Unit price", pre.unitPrice, 'type="number" inputmode="decimal" step="any" min="0"') +
      '<div class="cell field"><label for="qn">Note to customer (optional)</label><textarea id="qn">' + esc(pre.notes || "") + "</textarea></div></div>" +
      (prod ? '<p class="footnote">Today in your catalogue: ' + THB(now) + " per unit at " + q.qty + " pcs.</p>" : "") +
      '<div class="spacer"></div><button class="btn btn-primary btn-block" id="sendQ">' + (qt ? "Update quotation" : "Send quotation") + "</button>";

    const html =
      '<div class="list-header">Customer</div><div class="list">' +
        dl("Name", esc(q.company)) + dl("Email", q.email ? '<a style="color:var(--blue)" href="mailto:' + esc(q.email) + '">' + esc(q.email) + "</a>" : "") +
        dl("Phone", q.phone ? '<a style="color:var(--blue)" href="tel:' + esc(q.phone) + '">' + esc(q.phone) + "</a>" : "") +
        dl("WhatsApp", wa ? '<a style="color:var(--blue)" target="_blank" rel="noopener" href="https://wa.me/' + wa + '">' + esc(q.whatsapp || q.phone) + "</a>" : "") + dl("Address", esc(q.address)) + "</div>" +
      '<div class="list-header">Request · ' + esc(q.ref) + '</div><div class="list">' +
        dl("Product", esc(q.product)) + dl("Quantity", q.qty + " pcs") + dl("Options", esc([q.color, (q.sizes || []).join(", ")].filter(Boolean).join(" · "))) +
        dl("Packaging", esc(q.packaging)) + dl("Customisation", esc(q.customization)) + dl("Notes", esc(q.notes)) +
        dl("They saw", q.estUnitPrice ? Store.money(q.estUnitPrice, q.estCurrency) + " / pc" : "") + dl("Sent", Store.fmtDate(q.createdAt)) + "</div>" +

      (q.status === "pending" ? '<div class="list-header">Send quotation</div>' + quotationForm({ currency: "THB", qty: q.qty, unitPrice: now }) : "") +

      (qt ? '<div class="list-header">Quotation sent</div><div class="list">' + dl("Unit price", Store.money(qt.unitPrice, qt.currency)) + dl("Quantity", qt.qty + " pcs") +
        dl("Total", "<b>" + Store.money(qt.unitPrice * qt.qty, qt.currency) + "</b>") + dl("Customer", q.acceptedAt ? '<span class="badge green">Accepted ' + Store.fmtDate(q.acceptedAt) + "</span>" : '<span class="badge">Not accepted yet</span>') + "</div>" : "") +

      (q.status === "quoted" ? '<div class="list-header">Create invoice</div><div class="list">' +
        '<div class="cell field-row">' + half("ic", "Currency", cur, 'maxlength="3" autocapitalize="characters"') + half("iq", "Quantity", qt.qty, 'type="number" inputmode="numeric" min="1"') + "</div>" +
        field("ip", "Final unit price", qt.unitPrice, 'type="number" inputmode="decimal" step="any" min="0"') +
        '<div class="cell field-row">' + half("is", "Shipping", "", 'type="number" inputmode="decimal" step="any" min="0" placeholder="0"') + half("it", "Tax / duties", "", 'type="number" inputmode="decimal" step="any" min="0" placeholder="0"') + "</div>" +
        field("io", "Other charges", "", 'type="number" inputmode="decimal" step="any" min="0" placeholder="0"') +
        '<div class="cell field-row">' + half("id", "Ships on", "", 'type="date"') + half("iw", "Delivery window", "", 'placeholder="Sep 25–30"') + "</div></div>" +
        '<div class="spacer"></div><button class="btn btn-primary btn-block" id="sendI">Send invoice</button>' +
        '<details style="margin-top:20px"><summary style="color:var(--blue);cursor:pointer;padding:6px 16px">Revise quotation</summary><div class="spacer"></div>' + quotationForm({ currency: qt.currency, qty: qt.qty, unitPrice: qt.unitPrice, notes: qt.notes }) + "</details>" : "") +

      (inv ? '<div class="list-header">Invoice</div><div class="list">' + dl("Unit price", Store.money(inv.unitPrice, inv.currency)) + dl("Quantity", inv.qty + " pcs") +
        dl("Shipping", inv.shipping ? Store.money(inv.shipping, inv.currency) : "") + dl("Tax / duties", inv.tax ? Store.money(inv.tax, inv.currency) : "") + dl("Other", inv.other ? Store.money(inv.other, inv.currency) : "") +
        dl("Total", "<b>" + Store.money(Store.invoiceTotal(inv), inv.currency) + "</b>") + dl("Ships", inv.shipDate ? Store.fmtDate(inv.shipDate) : "") + dl("Delivery", esc(inv.deliveryWindow)) + "</div>" : "") +
      (q.status === "invoiced" ? '<div class="spacer"></div><button class="btn btn-green btn-block" id="paid">Mark as paid</button>' : "") +
      (q.status === "paid" ? '<p class="footnote center">Paid' + (q.paidAt ? " " + Store.fmtDate(q.paidAt) : "") + " ✓</p>" : "");

    openSheet("Quote", html);

    const sendQ = document.getElementById("sendQ");
    if (sendQ) sendQ.onclick = () => run(sendQ, "Sending…", async () => {
      await Store.admin.sendQuotation(q.ref, { currency: val("qc"), unitPrice: val("qp"), qty: val("qq"), notes: val("qn") });
      $sheet.close(); UI.toast("Quotation sent"); await reloadQuotes();
    });
    const sendI = document.getElementById("sendI");
    if (sendI) sendI.onclick = () => run(sendI, "Sending…", async () => {
      await Store.admin.sendInvoice(q.ref, { currency: val("ic"), unitPrice: val("ip"), qty: val("iq"), shipping: val("is"), tax: val("it"), other: val("io"), shipDate: val("id"), deliveryWindow: val("iw") });
      $sheet.close(); UI.toast("Invoice sent"); await reloadQuotes();
    });
    const paid = document.getElementById("paid");
    if (paid) paid.onclick = () => run(paid, "Saving…", async () => { await Store.admin.markPaid(q.ref); $sheet.close(); UI.toast("Marked as paid"); await reloadQuotes(); });
  }
  async function reloadQuotes() { quotes = await Store.admin.quotes(); if (tab === "quotes") renderQuotes(); }

  /* ================= SETTINGS ================= */
  function renderSettings() {
    const s = settings;
    document.getElementById("pane").innerHTML =
      '<div class="list-header">Contact (shown to customers)</div><div class="list">' +
        field("s_wa", "WhatsApp number", s.whatsapp, 'inputmode="tel" placeholder="+66 81 234 5678"') + field("s_mail", "Email", s.email, 'type="email" placeholder="orders@yourshop.com"') + "</div>" +
      '<div class="list-header">Payment instructions</div><div class="list"><div class="cell field"><label for="s_pay">Shown on every invoice</label><textarea id="s_pay" placeholder="Bank, account name, number…">' + esc(s.paymentInfo || "") + "</textarea></div></div>" +
      '<div class="list-header">Show prices in your customers\' currency</div><div class="list">' +
        '<div class="cell field-row">' + half("s_code", "Code", s.displayCode, 'maxlength="3" placeholder="NGN" autocapitalize="characters"') + half("s_sym", "Symbol", s.displaySymbol, 'placeholder="₦"') + "</div>" +
        field("s_rate", "How many of that currency for 1 baht (฿1)?", s.rate || "", 'type="number" inputmode="decimal" step="any" min="0" placeholder="e.g. 45"') + "</div>" +
      '<p class="footnote">Prices are stored in Thai baht. With this on, customers also see “≈ ₦…” under each price. Leave the rate empty to turn it off. Update it whenever the rate moves.</p>' +
      '<div class="spacer"></div><button class="btn btn-primary btn-block" id="saveS">Save settings</button>' +

      '<div class="list-header" style="margin-top:36px">Change all prices</div><div class="list">' +
        field("adj", "Raise or lower every price by (%)", "", 'type="number" inputmode="decimal" step="any" placeholder="e.g. 5 or -3"') + "</div>" +
      '<p class="footnote">Use this when the exchange rate or dealer prices shift. Every price and bulk price break moves by that percentage (rounded to whole baht).</p>' +
      '<div class="spacer"></div><button class="btn btn-block" id="applyAdj">Apply to all prices</button>' +

      '<div class="list-header" style="margin-top:36px">Data</div><div class="list"><div class="cell"><span class="grow muted">Mode</span><span class="value" style="color:var(--label)">' + (Store.remote ? "Live" : "Demo (this browser only)") + "</span></div></div>" +
      (Store.remote ? "" : '<p class="footnote">Demo mode keeps everything in this browser. To share products with customers, connect the live API — see the README.</p><div class="spacer"></div><button class="btn btn-block btn-danger" id="reset">Reset demo data</button>');

    document.getElementById("saveS").onclick = (e) => run(e.target, "Saving…", async () => {
      settings = await Store.saveSettings(Object.assign({}, settings, {
        whatsapp: val("s_wa"), email: val("s_mail"), paymentInfo: val("s_pay"), displayCode: val("s_code"), displaySymbol: val("s_sym"), rate: parseFloat(val("s_rate")) || 0,
      }));
      UI.toast("Settings saved");
    });
    document.getElementById("applyAdj").onclick = (e) => {
      const pct = parseFloat(val("adj"));
      if (!isFinite(pct) || pct === 0) { UI.toast("Enter a percentage first"); return; }
      if (!confirm("Change ALL prices by " + (pct > 0 ? "+" : "") + pct + "%?")) return;
      run(e.target, "Applying…", async () => { await Store.adjustPrices(pct); await reloadProducts(); document.getElementById("adj").value = ""; UI.toast("All prices updated"); });
    };
    const reset = document.getElementById("reset");
    if (reset) reset.onclick = () => { if (confirm("Delete all demo products, quotes and settings from this browser?")) { Store.resetDemo(); location.reload(); } };
  }

  /* ---------- boot ---------- */
  async function boot() {
    if (Store.admin.needsLogin()) return gate();
    shell();
    document.getElementById("pane").innerHTML = '<div class="skel" style="height:260px"></div>';
    try {
      [products, quotes, settings] = await Promise.all([Store.products({ admin: true }), Store.admin.quotes(), Store.settings()]);
      renderPane();
    } catch (e) {
      if (e.status === 401) { Store.admin.logout(); return gate(); }
      document.getElementById("pane").innerHTML = '<div class="empty">' + UI.icon("info", 56) + "<h3>Couldn't load</h3><p>" + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Try again</button></div>';
    }
  }
  boot();
})();
</script>
</body>
</html>
