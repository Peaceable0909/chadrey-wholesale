name = "chadrey-wholesale-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# One KV namespace holds everything: the product catalogue, photos, settings and quotes.
# Created as "chadrey-wholesale-QUOTES" in your Cloudflare account.
[[kv_namespaces]]
binding = "QUOTES"
id = "ec503fff3253488d9abea72bada36927"

# Secrets (set with `wrangler secret put NAME`, never commit real values):
#   ADMIN_TOKEN               — your owner access code. Anyone who has it can add/edit products
#                                and prices and see all customers, so make it long and random.
#                                (Required: without it every /api/admin/* route refuses requests.)
#   APPS_SCRIPT_WEBHOOK_URL   — (optional) the deployed Google Apps Script web app URL, for emails
#   APPS_SCRIPT_SHARED_SECRET — (optional) a random string both sides check, so the Apps Script
#                                endpoint only accepts requests that actually came from this Worker
